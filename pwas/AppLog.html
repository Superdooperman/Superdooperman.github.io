        body { font-family: 'Inter', system_ui, sans-serif; }

<body class="bg-zinc-950 text-zinc-200">
    <!-- Header -->
    <div class="border-b border-zinc-800 bg-zinc-900 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-semibold tracking-tighter">My App Catalog</h1>
                <p class="text-xs text-zinc-400">280+ apps • Your personal App Store</p>
            </div>
            <button onclick="showAddModal()" class="px-5 py-2.5 bg-white text-zinc-900 rounded-2xl text-sm font-semibold flex items-center gap-x-2 hover:bg-zinc-100">
                <i class="fa-solid fa-plus"></i> Add App
            </button>
        </div>
    </div>

    <!-- Search -->
    <div class="max-w-6xl mx-auto px-6 pt-6">
        <input type="text" id="searchInput" onkeyup="filterApps()" placeholder="Search apps..." class="w-full bg-zinc-900 border border-zinc-700 px-5 py-3.5 rounded-3xl text-sm focus:outline-none">
    </div>

    <div class="max-w-6xl mx-auto px-6 py-8" id="appsContainer"></div>

    <!-- Preview Modal -->
    <div id="previewModal" onclick="if (event.target.id === 'previewModal') hidePreviewModal()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[70]">
        <div onclick="event.stopImmediatePropagation()" class="bg-zinc-900 border border-zinc-700 rounded-3xl w-full max-w-md mx-4 overflow-hidden">
            <div id="previewContent" class="p-6"></div>
            <div class="border-t border-zinc-800 p-4 flex gap-x-3">
                <button onclick="hidePreviewModal()" class="flex-1 py-3 rounded-2xl border border-zinc-700 text-sm">Close</button>
                <button id="openStoreBtn" onclick="openInAppStore()" class="flex-1 py-3 bg-white text-zinc-900 rounded-2xl text-sm font-semibold flex items-center justify-center gap-x-2">
                    <i class="fa-solid fa-external-link-alt"></i>
                    <span>Open in App Store</span>
                </button>
            </div>
        </div>
    </div>

        let editingId = null;
        let currentPreviewApp = null;

        function renderApps(filteredApps = apps) {
            const container = document.getElementById('appsContainer');
            container.innerHTML = '';
            
            const grouped = {};
            filteredApps.forEach(app => {
                const letter = app.name[0].toUpperCase();
                if (!grouped[letter]) grouped[letter] = [];
                grouped[letter].push(app);
            });
            
            Object.keys(grouped).sort().forEach(letter => {
                let html = `<div class="mb-8">
                    <div class="px-4 py-2 mb-3 flex items-center gap-x-2 bg-zinc-900 rounded-t-3xl">
                        <span class="font-bold text-lg">${letter}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">`;
                
                grouped[letter].forEach(app => {
                    html += `
                        <div class="app-card bg-zinc-900 border border-zinc-800 rounded-3xl p-4 flex gap-x-4 cursor-pointer" onclick="showPreview(${app.id})">
                            <div class="w-14 h-14 flex-shrink-0 rounded-2xl overflow-hidden flex items-center justify-center text-4xl bg-zinc-800">
                                ${app.icon ? (app.icon.startsWith('http') ? `<img src="${app.icon}" class="w-full h-full object-cover">` : app.icon) : '📱'}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="font-semibold truncate">${app.name}</div>
                                <div class="text-sm text-zinc-400 line-clamp-2 mt-0.5">${app.description || ''}</div>
                                
                                ${app.appStoreUrl ? `
                                    <button onclick="event.stopImmediatePropagation(); window.open('${app.appStoreUrl}', '_blank')" 
                                            class="mt-3 text-xs bg-emerald-900 hover:bg-emerald-800 text-emerald-300 px-3 py-1 rounded-2xl flex items-center gap-x-1 w-fit">
                                        <i class="fa-solid fa-external-link-alt text-xs"></i>
                                        <span>App Store</span>
                                    </button>
                                ` : ''}
                            </div>
                        </div>`;
                });
                
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function showPreview(id) {
            const app = apps.find(a => a.id === id);
            if (!app) return;
            currentPreviewApp = app;
            
            const content = document.getElementById('previewContent');
            content.innerHTML = `
                <div class="flex gap-x-5">
                    <div class="w-20 h-20 flex-shrink-0 rounded-3xl overflow-hidden flex items-center justify-center text-6xl bg-zinc-800">
                        ${app.icon ? (app.icon.startsWith('http') ? `<img src="${app.icon}" class="w-full h-full object-cover">` : app.icon) : '📱'}
                    </div>
                    <div class="flex-1">
                        <div class="font-bold text-2xl">${app.name}</div>
                        <div class="text-emerald-400 text-sm">${app.category}</div>
                    </div>
                </div>
                
                <div class="mt-6">
                    <div class="text-xs text-zinc-400 mb-1">DESCRIPTION</div>
                    <div class="text-sm">${app.description || 'No description added yet.'}</div>
                </div>
                
                ${app.notes ? `
                    <div class="mt-5">
                        <div class="text-xs text-zinc-400 mb-1">YOUR NOTES</div>
                        <div class="text-sm bg-zinc-950 border border-zinc-800 p-3 rounded-2xl">${app.notes}</div>
                    </div>
                ` : ''}
            `;
            
            const openBtn = document.getElementById('openStoreBtn');
            openBtn.style.display = app.appStoreUrl ? 'flex' : 'none';
            
            document.getElementById('previewModal').classList.remove('hidden');
            document.getElementById('previewModal').classList.add('flex');
        }

        function openInAppStore() {
            if (currentPreviewApp && currentPreviewApp.appStoreUrl) {
                window.open(currentPreviewApp.appStoreUrl, '_blank');
            }
        }

        function hidePreviewModal() {
            document.getElementById('previewModal').classList.remove('flex');
            document.getElementById('previewModal').classList.add('hidden');
        }

        function filterApps() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = apps.filter(a => 
                a.name.toLowerCase().includes(term) || 
                (a.description && a.description.toLowerCase().includes(term))
            );
            renderApps(filtered);
        }

        function showAddModal() {
            alert("Add/Edit modal would open here (full version available if needed)");
        }

        function init() {
            const saved = localStorage.getItem('myAppCatalog');
            if (saved) apps = JSON.parse(saved);
            renderApps();
        }
        
        window.onload = init;
    </script>

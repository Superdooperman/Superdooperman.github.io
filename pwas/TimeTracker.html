<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rooster Timer · Superdooper Arcade</title>
<meta name="theme-color" content="#08080a">
<link rel="manifest" href="time-manifest.json">
<link rel="icon" href="time/icon-192.png">
<link rel="apple-touch-icon" href="time/icon-192.png">
<link rel="stylesheet" href="inkblob.css">
<link rel="stylesheet" href="time/time.css">
<script src="sw-register.js" defer></script>
</head>
<body class="ink-grain">
<div class="wrap">
  <header class="top">
    <a class="btn" href="./">← Arcade</a>
    <h1 class="ink-title tt-title">ROOSTER TIMER</h1>
    <div class="top-r">
      <button class="icon" id="muteBtn" title="Sound (M)" aria-label="Toggle sound">🔊</button>
      <button class="icon" id="setBtn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="pomo" class="on">🥚 Pomodoro</button>
    <button role="tab" data-tab="track">⏱ Tracker</button>
    <button role="tab" data-tab="hist">📊 History</button>
  </nav>

  <!-- POMODORO -->
  <section id="tab-pomo" class="tab on">
    <div class="phase-pills" id="phasePills">
      <button data-ph="focus" class="on">Focus</button><button data-ph="short">Short break</button><button data-ph="long">Long break</button>
    </div>
    <div class="stage">
      <div class="ring" id="ring">
        <canvas id="egg" class="px" aria-hidden="true"></canvas>
        <div class="bubble" id="bubble" hidden>PAH KAW!</div>
      </div>
      <canvas id="buddy" class="px buddy" width="32" height="32" aria-hidden="true"></canvas>
    </div>
    <div class="clock ink-title" id="clock" aria-live="off">25:00</div>
    <div class="phase-label" id="phaseLabel">Focus · egg 1 of 4</div>
    <div class="ctrls">
      <button class="ink-btn" id="startBtn">▶ START</button>
      <button class="btn2" id="skipBtn" title="Skip (S)">⏭ Skip</button>
      <button class="btn2" id="resetBtn" title="Reset (R)">↺ Reset</button>
    </div>
    <label class="taskpick">Logging to
      <select id="pomoTask"></select>
    </label>
    <div class="stats">
      <div><b id="stToday">0</b><span>eggs today</span></div>
      <div><b id="stStreak">0</b><span>day streak</span></div>
      <div><b id="stTotal">0</b><span>eggs ever</span></div>
    </div>
    <div class="nest" id="nest" aria-label="Today's eggs"></div>
    <p class="hint">Space start/pause · S skip · R reset · M mute</p>
  </section>

  <!-- TRACKER -->
  <section id="tab-track" class="tab">
    <div id="timerArea" class="card live" hidden>
      <div class="task-name" id="currentTaskName"></div>
      <div class="timer ink-title" id="liveTimer">00:00:00</div>
      <button id="stopBtn" class="ink-btn">■ STOP</button>
    </div>
    <div class="card total">
      <span>Total time tracked</span>
      <div class="total-time" id="totalTime">0h 0m 0s</div>
    </div>
    <div class="row-h"><span>Tasks · most used first</span><button class="btn2 sm" id="editBtn">✏️ Edit</button></div>
    <div id="taskGrid" class="task-grid"></div>
    <button id="newTaskBtn" class="ink-btn wide">+ NEW TASK &amp; START</button>
  </section>

  <!-- HISTORY -->
  <section id="tab-hist" class="tab">
    <div class="card"><canvas id="barChart" width="640" height="300"></canvas></div>
    <h3>Sessions (newest first)</h3>
    <div id="historyList"></div>
    <div class="ctrls">
      <button class="btn2" id="exportBtn">⬇ Export JSON</button>
      <button class="btn2" id="importBtn">⬆ Import JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>
</div>

<!-- Modals -->
<div id="newModal" class="modal"><div class="modal-content card">
  <h2>New task</h2>
  <input type="text" id="taskInput" class="ink-input" placeholder="Task name" autocomplete="off" maxlength="60">
  <div class="mbtns"><button class="btn2" data-close>Cancel</button><button class="ink-btn" id="newOk">Start</button></div>
</div></div>
<div id="editModal" class="modal"><div class="modal-content card">
  <h2>Rename task</h2>
  <input type="text" id="editInput" class="ink-input" autocomplete="off" maxlength="60">
  <div class="mbtns"><button class="btn2" data-close>Cancel</button><button class="ink-btn" id="editOk">Save</button></div>
</div></div>
<div id="setModal" class="modal"><div class="modal-content card">
  <h2>Settings</h2>
  <div class="grid2">
    <label>Focus (min)<input type="number" class="ink-input" id="sFocus" min="1" max="180"></label>
    <label>Short break<input type="number" class="ink-input" id="sShort" min="1" max="60"></label>
    <label>Long break<input type="number" class="ink-input" id="sLong" min="1" max="90"></label>
    <label>Long break every<input type="number" class="ink-input" id="sEvery" min="2" max="12"></label>
  </div>
  <label class="chk"><input type="checkbox" id="sAuto"> Auto-start next phase</label>
  <label class="chk"><input type="checkbox" id="sNotify"> Notifications when a phase ends</label>
  <label class="chk"><input type="checkbox" id="sWake"> Keep screen awake while running</label>
  <label>Volume <input type="range" id="sVol" min="0" max="1" step="0.05"></label>
  <p class="small" id="spriteInfo"></p>
  <div class="mbtns"><button class="btn2" id="testSnd">🐓 Test crow</button><button class="ink-btn" data-close>Done</button></div>
</div></div>

<script src="time/rooster.js"></script>
<script src="time/egg.js"></script>
<script src="time/app.js"></script>
</body>
</html>

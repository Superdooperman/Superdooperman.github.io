<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>NIGHT LARK</title>
    <meta name="theme-color" content="#12141c" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="./game.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?external=react",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const parts = ["./parts/part0.js", "./parts/part1.js", "./parts/part2.js", "./parts/part3.js"];
      const chunks = [];
      for (const href of parts) {
        const res = await fetch(href);
        if (!res.ok) throw new Error(href);
        chunks.push(await res.text());
      }
      const url = URL.createObjectURL(new Blob([chunks.join("")], { type: "text/javascript" }));
      await import(url);
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
</html>
